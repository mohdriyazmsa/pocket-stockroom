<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stockroom">
<meta name="theme-color" content="#0d1321">
<title>Pocket Stockroom</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Concept: a pocket "control room" for stock. Night-navy deck on top (health gauge), crisp cards below, a lit cobalt scan button docked in the tab bar */
:root{
  --deck:#0d1321; --deck-2:#18213a; --deck-ink:#eef2ff; --deck-mute:#8d98b8;
  --bg:#eef0f6; --card:#ffffff; --ink:#0d1321; --mute:#667089; --line:#e1e4ee;
  --accent:#3d5afe; --accent-2:#6e85ff; --accent-soft:#e6eaff;
  --ok:#14a06b; --ok-soft:#dcf5ea; --low:#e8590c; --low-soft:#ffe8d9; --out:#d6264b; --out-soft:#fde2e8; --exp:#a855f7; --exp-soft:#f2e6ff;
  --f-disp:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"Figtree",system-ui,-apple-system,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:18px; --shadow:0 1px 2px rgba(13,19,33,.06),0 6px 20px rgba(13,19,33,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a0f1b; --card:#141b2d; --ink:#eef2ff; --mute:#8d98b8; --line:#232c44;
  --accent-soft:#1d2550; --ok-soft:#0f2e24; --low-soft:#38200f; --out-soft:#3a1520; --exp-soft:#2b1844;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select{font:inherit;color:var(--ink);font-size:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gut{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}

/* ---------- deck (top) ---------- */
.deck{background:var(--deck);color:var(--deck-ink);padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:26px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.deck::after{content:"";position:absolute;inset:auto -40px -120px auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(61,90,254,.35),transparent 65%);pointer-events:none}
.topbar{display:flex;align-items:center;justify-content:space-between}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--deck-mute);font-weight:600}
h1{font-family:var(--f-disp);font-stretch:125%;font-weight:800;font-size:30px;letter-spacing:-.01em;margin:4px 0 0;line-height:1}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--deck-2);display:grid;place-items:center;color:var(--deck-ink)}
.health{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:22px;position:relative;z-index:1}
.ring{width:108px;height:108px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .num b{font-family:var(--f-disp);font-stretch:110%;font-size:30px;font-weight:800;display:block;line-height:1}
.ring .num span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--deck-mute)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:0}
.tile{background:var(--deck-2);border-radius:14px;padding:10px 12px;min-width:0;text-align:left}
.tile b{font-family:var(--f-disp);font-stretch:110%;font-size:22px;font-weight:800;display:block;line-height:1.1;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile span{font-size:11px;color:var(--deck-mute);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}

/* ---------- body ---------- */
main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.searchrow{margin-top:-22px;position:relative;z-index:2}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;height:50px;box-shadow:var(--shadow)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;height:100%}
.search svg{color:var(--mute);flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{font-family:var(--f-mono);font-size:11px;opacity:.7}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 10px}
.sect h2{font-family:var(--f-disp);font-stretch:112%;font-size:18px;font-weight:800;margin:0}
.sect small{color:var(--mute);font-size:12px}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:grid;grid-template-columns:46px 1fr auto;gap:4px 12px;align-items:center;text-align:left;width:100%}
.badge{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-disp);font-stretch:115%;font-weight:800;font-size:16px;color:#fff;grid-row:1/span 2;letter-spacing:.02em}
.card .nm{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{font-size:12px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .qty{grid-row:1/span 2;grid-column:3;text-align:right}
.card .qty b{font-family:var(--f-disp);font-stretch:110%;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;display:block}
.card .qty span{font-size:11px;color:var(--mute)}
.bar{grid-column:1/-1;height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:9px}
.meta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:5px}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-low{background:var(--low-soft);color:var(--low)} .p-out{background:var(--out-soft);color:var(--out)} .p-exp{background:var(--exp-soft);color:var(--exp)} .p-ex{background:var(--line);color:var(--mute)} .p-loc{background:var(--accent-soft);color:var(--accent)}
.empty{background:var(--card);border-radius:var(--r);padding:30px 20px;text-align:center;color:var(--mute);box-shadow:var(--shadow)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px;font-family:var(--f-disp);font-stretch:110%}
.day{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
.mv{background:var(--card);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:40px 1fr auto;gap:2px 12px;align-items:center;box-shadow:var(--shadow)}
.mv .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;grid-row:1/span 2;font-weight:800}
.mv .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .s{font-size:12px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv .t,.mv .s{grid-column:2}
.mv .d{grid-column:3;grid-row:1/span 2;font-family:var(--f-mono);font-weight:600;font-size:15px}
.in{color:var(--ok)} .out{color:var(--out)}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:15px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .ri{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.row div{flex:1;min-width:0} .row small{display:block;color:var(--mute);font-size:12px}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:8px max(12px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:end}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);padding:4px 0;position:relative}
.tab[aria-current="page"]{color:var(--accent)}
.tab .n{position:absolute;top:-2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--out);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.scanfab{justify-self:center;width:68px;height:68px;border-radius:24px;margin-top:-30px;background:linear-gradient(150deg,var(--accent-2),var(--accent));color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(61,90,254,.45),0 0 0 5px var(--bg)}
.scanfab:active{transform:scale(.95)}

/* ---------- sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:30;background:rgba(8,12,22,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.sh-head{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center}
.sh-head .badge{width:56px;height:56px;border-radius:17px;font-size:19px;grid-row:auto}
.sh-head h3{font-family:var(--f-disp);font-stretch:112%;font-weight:800;font-size:22px;margin:0;line-height:1.1;overflow-wrap:anywhere}
.sh-head p{margin:2px 0 0;color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.counter{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:6px}
.counter .big{font-family:var(--f-disp);font-stretch:115%;font-weight:900;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.counter small{color:var(--mute);text-align:center}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;width:100%;margin-top:6px}
.stepper button{height:56px;border-radius:18px;background:var(--accent-soft);color:var(--accent);font-size:26px;font-weight:700}
.stepper input{height:56px;border-radius:18px;border:1px solid var(--line);background:var(--bg);text-align:center;font-family:var(--f-mono);font-size:22px;font-weight:600;min-width:0;width:100%}
.act{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:54px;border-radius:17px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.b-in{background:var(--ok);color:#fff} .b-out{background:var(--out);color:#fff} .b-pri{background:var(--accent);color:#fff} .b-sec{background:var(--card);border:1px solid var(--line);color:var(--ink)} .b-dan{background:var(--out-soft);color:var(--out)}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--mute);min-width:0}
.field input{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;width:100%;min-width:0;outline:none}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;width:100%}
.confirm{background:var(--out-soft);color:var(--out);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.confirm .btn{height:40px;width:auto;padding:0 16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- scanner ---------- */
.live{position:fixed;inset:0;z-index:40;background:#000}
.live video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.live .shade{position:absolute;left:7%;right:7%;top:28%;height:30%;border-radius:22px;box-shadow:0 0 0 9999px rgba(0,0,0,.55)}
.live .corner{position:absolute;width:34px;height:34px;border:4px solid #fff}
.c1{left:7%;top:28%;border-right:0;border-bottom:0;border-top-left-radius:22px}
.c2{right:7%;top:28%;border-left:0;border-bottom:0;border-top-right-radius:22px}
.c3{left:7%;top:calc(58% - 34px);border-right:0;border-top:0;border-bottom-left-radius:22px}
.c4{right:7%;top:calc(58% - 34px);border-left:0;border-top:0;border-bottom-right-radius:22px}
.laser{position:absolute;left:10%;right:10%;top:43%;height:2px;background:linear-gradient(90deg,transparent,#6e85ff,transparent);box-shadow:0 0 12px #6e85ff}
@media (prefers-reduced-motion:no-preference){.laser{animation:sweep 1.8s ease-in-out infinite alternate}@keyframes sweep{from{top:30%}to{top:56%}}
.sheet{animation:up .22s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px)}}}
.live .top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);left:18px;right:18px;color:#fff;text-align:center}
.live .top b{font-family:var(--f-disp);font-stretch:115%;font-size:20px;font-weight:800;display:block}
.live .top span{font-size:13px;opacity:.8}
.live .bot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;justify-content:center;gap:22px}
.live .round{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;display:grid;place-items:center}
.live .round.x{background:#fff;color:#000}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--deck);color:#fff;padding:11px 18px;border-radius:99px;font-weight:600;z-index:50;max-width:calc(100% - 36px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.msg{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;background:var(--out-soft);color:var(--out)}
@media (min-width:700px){main,.deck>.gut{max-width:680px;margin-inline:auto}}
</style>
</head><body>

<header class="deck">
  <div class="gut">
    <div class="topbar">
      <div><div class="eyebrow" id="today">Inventory</div><h1>Stockroom</h1></div>
      <button class="iconbtn" id="addBtn" aria-label="Add item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="health">
      <div class="ring" aria-label="Stock health">
        <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#232d4a" stroke-width="12"/><circle id="ringArc" cx="60" cy="60" r="50" fill="none" stroke="#3d5afe" stroke-width="12" stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="314"/></svg>
        <div class="num"><div><b id="hPct">–</b><span>healthy</span></div></div>
      </div>
      <div class="tiles">
        <button class="tile" data-go="items"><b id="tItems">–</b><span>Items · <em class="mono" id="tUnits" style="font-style:normal">–</em> units</span></button>
        <button class="tile" data-go="items"><b id="tValue">–</b><span>Stock value</span></button>
        <button class="tile" data-go="alerts"><b id="tLow">–</b><span><i class="dot" style="background:#ff8a3d"></i>Low / out</span></button>
        <button class="tile" data-go="alerts"><b id="tExp">–</b><span><i class="dot" style="background:#c084fc"></i>Expiring 7d</span></button>
      </div>
    </div>
  </div>
</header>

<main class="gut">
  <div id="viewItems">
    <div class="searchrow"><label class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" placeholder="Search items, codes, locations" autocomplete="off" aria-label="Search"></label></div>
    <div id="scanMsg" class="msg" hidden></div>
    <div class="chips" id="chips"></div>
    <div class="sect"><h2 id="listTitle">All items</h2><small id="listCount"></small></div>
    <div class="list" id="list"></div>
  </div>
  <div id="viewAlerts" hidden><div class="sect" style="margin-top:22px"><h2>Needs attention</h2><small id="alertCount"></small></div><div class="list" id="alerts"></div></div>
  <div id="viewHist" hidden><div class="sect" style="margin-top:22px"><h2>Activity</h2><small id="histCount"></small></div><div id="hist"></div></div>
  <div id="viewMore" hidden>
    <div class="sect" style="margin-top:22px"><h2>Tools</h2></div>
    <div class="panel">
      <button class="row" id="exportBtn"><span class="ri"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg></span><div>Export to Excel<small>Stock list + full history as a CSV file</small></div></button>
      <label class="row" for="cam"><span class="ri"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg></span><div>Scan from a photo<small>If live scanning struggles, take a picture instead</small></div><input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
      <button class="row" id="typeBtn"><span class="ri"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg></span><div>Add item by hand<small>Type a barcode number or create an item without one</small></div></button>
    </div>
    <p style="color:var(--mute);font-size:12px;margin:14px 4px">Your stock is saved on this iPhone only. Export regularly as a backup.</p>
  </div>
</main>

<nav class="tabbar" aria-label="Sections">
  <button class="tab" data-tab="items" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Stock</button>
  <button class="tab" data-tab="alerts"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zM10 20a2 2 0 0 0 4 0"/></svg>Alerts<span class="n" id="alertBadge" hidden></span></button>
  <button class="scanfab" id="liveBtn" aria-label="Scan barcode"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V5h3M20 8V5h-3M4 16v3h3M20 16v3h-3"/><path d="M8 9v6M11 9v6M14 9v6M17 9v6"/></svg></button>
  <button class="tab" data-tab="hist"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Activity</button>
  <button class="tab" data-tab="more"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>More</button>
</nav>

<div class="live" id="live" hidden>
  <video id="vid" playsinline muted autoplay></video>
  <div class="shade"></div><i class="corner c1"></i><i class="corner c2"></i><i class="corner c3"></i><i class="corner c4"></i><div class="laser"></div>
  <div class="top"><b>Scan barcode</b><span id="liveTip">Starting camera…</span></div>
  <div class="bot">
    <button class="round" id="torch" hidden aria-label="Flashlight"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
    <button class="round x" id="liveClose" aria-label="Close scanner"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
</div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>
<canvas id="cv" hidden></canvas>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js" crossorigin="anonymous"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LKEY="pocket-stockroom-v1";
let items={}, moves=[], tab="items", cat="All";
function load(){try{const d=JSON.parse(localStorage.getItem(LKEY)||"null");if(d){items=d.items||{};moves=d.moves||[];return true;}}catch(e){}return false;}
function save(){try{localStorage.setItem(LKEY,JSON.stringify({items,moves:moves.slice(0,1000)}));}catch(e){}}
if(!load()){const t=Date.now();
  items={ex1:{id:"ex1",name:"Printer paper A4",code:"0012345678905",qty:3,unit:"reams",reorder:5,cost:7.5,category:"Office",location:"Shelf A1",expiry:"",example:true,updatedAt:t},
    ex2:{id:"ex2",name:"AA batteries",code:"5012345678900",qty:24,unit:"units",reorder:8,cost:.9,category:"Electrical",location:"Drawer 2",expiry:"",example:true,updatedAt:t},
    ex3:{id:"ex3",name:"Olive oil 1L",code:"8001234567890",qty:2,unit:"bottles",reorder:1,cost:11,category:"Pantry",location:"Pantry",expiry:new Date(t+4*864e5).toISOString().slice(0,10),example:true,updatedAt:t}};
  moves=[{id:"m1",itemId:"ex2",name:"AA batteries",code:"5012345678900",delta:24,type:"receive",note:"Starting stock",at:t-36e5},{id:"m2",itemId:"ex1",name:"Printer paper A4",code:"0012345678905",delta:-2,type:"use",note:"Office printer",at:t-6e5}];save();}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
const money=n=>"$"+(n>=1e4?(Math.round(n/100)/10)+"k":n.toLocaleString(undefined,n<1000?{minimumFractionDigits:2,maximumFractionDigits:2}:{maximumFractionDigits:0}));
function status(i){const q=num(i.qty),r=num(i.reorder);if(q<=0)return"out";if(r>0&&q<=r)return"low";return"ok";}
function expDays(i){if(!i.expiry)return null;return Math.ceil((new Date(i.expiry+"T00:00")-new Date(new Date().toDateString()))/864e5);}
const PAL=["#3d5afe","#14a06b","#e8590c","#a855f7","#0ea5e9","#d6264b","#ca8a04","#0f766e","#db2777","#4f46e5"];
function colorFor(s){let h=0;for(const ch of String(s||"?"))h=(h*31+ch.charCodeAt(0))>>>0;return PAL[h%PAL.length];}
function initials(n){const w=String(n||"?").replace(/[^\p{L}\p{N} ]/gu,"").trim().split(/\s+/);return((w[0]||"?")[0]+((w[1]||"")[0]||(w[0]||"")[1]||"")).toUpperCase();}
function byCode(c){c=String(c).trim().toLowerCase();return Object.values(items).find(i=>String(i.code||"").toLowerCase()===c);}
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2200);}
function scanMsg(t){$("scanMsg").textContent=t||"";$("scanMsg").hidden=!t;if(t)setTab("items");}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";return new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"});}
$("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});

function pills(i){const s=status(i),d=expDays(i);let h="";
  if(s==="out")h+='<span class="pill p-out">Out of stock</span>';else if(s==="low")h+='<span class="pill p-low">Low · reorder</span>';else h+='<span class="pill p-ok">In stock</span>';
  if(d!==null&&d<=7)h+=`<span class="pill p-exp">${d<0?"Expired":d===0?"Expires today":"Expires in "+d+"d"}</span>`;
  if(i.location)h+=`<span class="pill p-loc">${esc(i.location)}</span>`;
  if(i.example)h+='<span class="pill p-ex">Example</span>';return h;}
function card(i){const s=status(i),r=num(i.reorder),q=num(i.qty);
  const pct=q<=0?0:Math.max(6,Math.min(100,r>0?q/(r*3)*100:100));const col=s==="out"?"var(--out)":s==="low"?"var(--low)":"var(--ok)";
  return `<button class="card" data-id="${esc(i.id)}"><span class="badge" style="background:${colorFor(i.category||i.name)}">${esc(initials(i.name))}</span><span class="nm">${esc(i.name)}</span><span class="qty"><b>${fmt(q)}</b><span>${esc(i.unit||"units")}</span></span><span class="sub mono">${esc(i.code||"no code")}${i.category?" · "+esc(i.category):""}</span><span class="bar"><i style="width:${pct}%;background:${col}"></i></span><span class="meta">${pills(i)}</span></button>`;}

function render(){
  const all=Object.values(items).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  const lowOut=all.filter(i=>status(i)!=="ok"), exp=all.filter(i=>{const d=expDays(i);return d!==null&&d<=7;});
  const healthy=all.length?Math.round((all.length-lowOut.length)/all.length*100):100;
  $("hPct").textContent=healthy+"%"; $("ringArc").style.strokeDashoffset=String(314-314*healthy/100);
  $("ringArc").style.stroke=healthy>=80?"#3d5afe":healthy>=50?"#ff8a3d":"#ff4d6d";
  $("tItems").textContent=all.length; $("tUnits").textContent=fmt(all.reduce((s,i)=>s+num(i.qty),0));
  $("tValue").textContent=money(all.reduce((s,i)=>s+num(i.qty)*num(i.cost),0));
  $("tLow").textContent=lowOut.length; $("tExp").textContent=exp.length;
  const al=[...new Set([...all.filter(i=>status(i)==="out"),...all.filter(i=>status(i)==="low"),...exp])];
  $("alertBadge").hidden=!al.length; $("alertBadge").textContent=al.length;
  const cats=["All",...[...new Set(all.map(i=>i.category).filter(Boolean))].sort()]; if(!cats.includes(cat))cat="All";
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===cat}">${esc(c)} <span class="c">${c==="All"?all.length:all.filter(i=>i.category===c).length}</span></button>`).join("");
  const q=$("search").value.trim().toLowerCase();
  const rows=all.filter(i=>(cat==="All"||i.category===cat)&&(!q||[i.name,i.code,i.location,i.category].join(" ").toLowerCase().includes(q)));
  $("listTitle").textContent=cat==="All"?"All items":cat; $("listCount").textContent=rows.length+" of "+all.length;
  $("list").innerHTML=!all.length?'<div class="empty"><b>Your stockroom is empty</b>Tap the blue scan button to add your first item.</div>':rows.length?rows.map(card).join(""):'<div class="empty"><b>No matches</b>Try another search or category.</div>';
  $("alertCount").textContent=al.length?al.length+" items":"";
  $("alerts").innerHTML=al.length?al.map(card).join(""):'<div class="empty"><b>All clear</b>Nothing is low, out, or about to expire.</div>';
  $("histCount").textContent=moves.length?moves.length+" moves":"";
  if(!moves.length){$("hist").innerHTML='<div class="empty"><b>No activity yet</b>Every receive and use shows up here.</div>';}
  else{let h="",last="";const td=new Date().toDateString(),yd=new Date(Date.now()-864e5).toDateString();
    for(const m of moves.slice(0,300)){const d=new Date(m.at).toDateString();
      if(d!==last){h+=`<div class="day">${d===td?"Today":d===yd?"Yesterday":new Date(m.at).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</div>`;last=d;}
      const inn=m.delta>=0;h+=`<div class="mv" style="margin-bottom:8px"><span class="ic" style="background:${inn?"var(--ok-soft)":"var(--out-soft)"};color:${inn?"var(--ok)":"var(--out)"}">${inn?"↓":"↑"}</span><span class="t">${esc(m.name)}</span><span class="d ${inn?"in":"out"}">${inn?"+":"−"}${fmt(Math.abs(m.delta))}</span><span class="s">${m.type==="count"?"Stock count":m.type==="receive"?"Received":"Used / shipped"}${m.note?" · "+esc(m.note):""} · ${new Date(m.at).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}</span></div>`;}
    $("hist").innerHTML=h;}
}
function setTab(t){tab=t;["items","alerts","hist","more"].forEach(k=>{$("view"+k[0].toUpperCase()+k.slice(1)).hidden=k!==t;});document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t?"page":"false"));window.scrollTo({top:0});}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setTab(b.dataset.go));
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(b){cat=b.dataset.cat;render();}};
$("search").addEventListener("input",render);
document.addEventListener("click",e=>{const c=e.target.closest(".card");if(c)openItem(c.dataset.id);});
$("addBtn").onclick=()=>openForm(null,"");
$("typeBtn").onclick=()=>openForm(null,"");

function closeSheet(){$("sheetRoot").innerHTML="";}
function sheet(html){$("sheetRoot").innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;$("sbg").addEventListener("click",e=>{if(e.target.id==="sbg")closeSheet();});}
function rec(m){moves.unshift({...m,id:"m"+Date.now()+Math.random().toString(36).slice(2,5),at:Date.now()});}
function openItem(id){
  const i=items[id];if(!i)return;const r=num(i.reorder);
  const hist=moves.filter(m=>m.itemId===id).slice(0,4);
  sheet(`<div class="sh-head"><span class="badge" style="background:${colorFor(i.category||i.name)}">${esc(initials(i.name))}</span><div><h3>${esc(i.name)}</h3><p class="mono">${esc(i.code||"no code")}${i.category?" · "+esc(i.category):""}</p></div></div>
  <div class="meta" style="margin:0">${pills(i)}</div>
  <div class="counter"><div class="big">${fmt(num(i.qty))}</div><small>${esc(i.unit||"units")} on hand${r>0?" · reorder at "+fmt(r):""}${num(i.cost)>0?" · worth "+money(num(i.qty)*num(i.cost)):""}</small>
  <div class="stepper"><button id="mn" aria-label="Less">−</button><input id="qty" type="number" inputmode="decimal" value="1" min="0" step="any" aria-label="Quantity"><button id="pl" aria-label="More">+</button></div></div>
  <input class="note" id="note" placeholder="Note (optional) · PO, supplier, reason">
  <div class="act"><button class="btn b-in" id="recv">＋ Receive</button><button class="btn b-out" id="use">− Use / ship</button></div>
  <button class="btn b-sec" id="count">Set exact count to this number</button>
  ${hist.length?`<div>${hist.map(m=>`<div class="mv" style="margin-bottom:8px;box-shadow:none"><span class="ic" style="background:${m.delta>=0?"var(--ok-soft)":"var(--out-soft)"};color:${m.delta>=0?"var(--ok)":"var(--out)"}">${m.delta>=0?"↓":"↑"}</span><span class="t">${esc(m.note||(m.type==="receive"?"Received":m.type==="count"?"Stock count":"Used"))}</span><span class="d ${m.delta>=0?"in":"out"}">${m.delta>=0?"+":"−"}${fmt(Math.abs(m.delta))}</span><span class="s">${ago(m.at)}</span></div>`).join("")}</div>`:""}
  <div class="act"><button class="btn b-sec" id="edit">Edit details</button><button class="btn b-dan" id="del">Delete</button></div><div id="cf"></div>`);
  const q=$("qty");$("mn").onclick=()=>q.value=Math.max(0,num(q.value)-1);$("pl").onclick=()=>q.value=num(q.value)+1;
  const mv=(sign,type)=>{const n=num(q.value);if(n<=0){q.focus();return;}const cur=num(items[id].qty),next=cur+sign*n;if(next<0){toast("Only "+fmt(cur)+" on hand");return;}
    items[id]={...items[id],qty:next,updatedAt:Date.now()};rec({itemId:id,name:i.name,code:i.code||"",delta:sign*n,type,note:$("note").value.trim()});save();render();closeSheet();toast((sign>0?"Received ":"Removed ")+fmt(n)+" · now "+fmt(next));};
  $("recv").onclick=()=>mv(1,"receive");$("use").onclick=()=>mv(-1,"use");
  $("count").onclick=()=>{const n=num(q.value),cur=num(items[id].qty);if(n!==cur){items[id]={...items[id],qty:n,updatedAt:Date.now()};rec({itemId:id,name:i.name,code:i.code||"",delta:n-cur,type:"count",note:$("note").value.trim()||"Stock count"});save();render();toast("Count set to "+fmt(n));}closeSheet();};
  $("edit").onclick=()=>openForm(items[id]);
  $("del").onclick=()=>{$("cf").innerHTML=`<div class="confirm"><span style="flex:1">Delete ${esc(i.name)}? Its history stays.</span><button class="btn b-out" id="yes">Delete</button><button class="btn b-sec" id="no">Keep</button></div>`;$("no").onclick=()=>$("cf").innerHTML="";$("yes").onclick=()=>{delete items[id];save();render();closeSheet();toast("Deleted");};};
}
function openForm(existing,code){
  const i=existing||{code:code||"",unit:"units"};const cats=[...new Set(Object.values(items).map(x=>x.category).filter(Boolean))].sort();
  sheet(`<h3 style="font-family:var(--f-disp);font-stretch:112%;font-weight:800;font-size:22px;margin:0">${existing?"Edit item":"New item"}</h3>
  ${!existing&&code?`<p style="margin:-6px 0 0;color:var(--mute)">Code <span class="mono">${esc(code)}</span> isn't in your stock yet.</p>`:""}
  <form id="f" style="display:flex;flex-direction:column;gap:12px">
  <label class="field">Name<input id="fName" required value="${esc(i.name||"")}" placeholder="e.g. Printer paper A4"></label>
  <label class="field">Barcode / code<input id="fCode" class="mono" value="${esc(i.code||"")}" placeholder="Scan or type"></label>
  <div class="g2">${existing?"":`<label class="field">Starting qty<input id="fQty" type="number" inputmode="decimal" step="any" min="0" value="1"></label>`}
  <label class="field">Unit<input id="fUnit" value="${esc(i.unit||"units")}" placeholder="units, kg, boxes"></label>
  <label class="field">Category<input id="fCat" list="catlist" value="${esc(i.category||"")}" placeholder="e.g. Pantry"><datalist id="catlist">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>
  <label class="field">Location<input id="fLoc" value="${esc(i.location||"")}" placeholder="Shelf B2"></label>
  <label class="field">Reorder at<input id="fRe" type="number" inputmode="decimal" step="any" min="0" value="${esc(i.reorder||"")}" placeholder="0 = off"></label>
  <label class="field">Cost per unit ($)<input id="fCost" type="number" inputmode="decimal" step="any" min="0" value="${esc(i.cost||"")}" placeholder="optional"></label>
  <label class="field">Expiry date<input id="fExp" type="date" value="${esc(i.expiry||"")}"></label></div>
  <button class="btn b-pri" type="submit">${existing?"Save changes":"Add to stock"}</button><button class="btn b-sec" type="button" id="cancel">Cancel</button></form>`);
  $("cancel").onclick=closeSheet;
  $("f").onsubmit=e=>{e.preventDefault();const name=$("fName").value.trim();if(!name)return;const c=$("fCode").value.trim();
    const dup=c&&byCode(c);if(dup&&(!existing||dup.id!==existing.id)){toast("That code belongs to "+dup.name);return;}
    const d={name,code:c,unit:$("fUnit").value.trim()||"units",category:$("fCat").value.trim(),location:$("fLoc").value.trim(),reorder:num($("fRe").value),cost:num($("fCost").value),expiry:$("fExp").value||"",updatedAt:Date.now()};
    if(existing){items[existing.id]={...existing,...d,example:false};toast("Saved");}
    else{const id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const q=num($("fQty").value);items[id]={...d,id,qty:q};if(q>0)rec({itemId:id,name,code:c,delta:q,type:"receive",note:"Starting stock"});toast("Added "+name);}
    save();render();closeSheet();};
}
function handleCode(code){code=String(code||"").trim();if(!code)return;scanMsg("");const hit=byCode(code);if(hit)openItem(hit.id);else openForm(null,code);}

function reader(){const Z=window.ZXing,h=new Map(),F=Z.BarcodeFormat;h.set(Z.DecodeHintType.TRY_HARDER,true);
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.CODE_93,F.ITF,F.CODABAR,F.QR_CODE,F.DATA_MATRIX,F.PDF_417,F.AZTEC]);
  const r=new Z.MultiFormatReader();r.setHints(h);return r;}
function tryDecode(r,cv){const Z=window.ZXing,src=new Z.HTMLCanvasElementLuminanceSource(cv);
  for(const mk of [()=>new Z.HybridBinarizer(src),()=>new Z.GlobalHistogramBinarizer(src),()=>new Z.HybridBinarizer(src.rotateCounterClockwise())]){
    try{return r.decodeWithState(new Z.BinaryBitmap(mk()));}catch(e){}finally{try{r.reset();}catch(_){}}}return null;}
$("cam").addEventListener("change",async e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  if(!window.ZXing){scanMsg("The barcode reader didn't load. Connect to the internet once, then try again.");return;}
  toast("Reading barcode…");
  try{const url=URL.createObjectURL(f),img=new Image();img.src=url;await img.decode();const cv=$("cv"),ctx=cv.getContext("2d",{willReadFrequently:true}),r=reader();let res=null;
    for(const max of [1400,900,2200]){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));cv.width=Math.round(img.naturalWidth*s);cv.height=Math.round(img.naturalHeight*s);ctx.drawImage(img,0,0,cv.width,cv.height);res=tryDecode(r,cv);if(res)break;}
    URL.revokeObjectURL(url);if(res)handleCode(res.getText());else scanMsg("Couldn't find a barcode in that photo. Fill the frame with the code in good light, or type it in.");
  }catch(err){scanMsg("Couldn't open that photo. Try again or type the code.");}});

let stream=null,scanning=false,timer=null,misses=0;
function stopLive(){scanning=false;clearTimeout(timer);try{stream&&stream.getTracks().forEach(t=>t.stop());}catch(e){}stream=null;$("vid").srcObject=null;$("live").hidden=true;$("torch").hidden=true;}
$("liveClose").onclick=stopLive;
$("liveBtn").onclick=async()=>{
  scanMsg("");
  if(!window.ZXing){scanMsg("The barcode reader didn't load. Connect to the internet once, then try again.");return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanMsg("Live camera isn't available here. Use More › Scan from a photo.");return;}
  $("live").hidden=false;$("liveTip").textContent="Starting camera…";
  try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}});}
  catch(e){stopLive();scanMsg(e&&e.name==="NotAllowedError"?"Camera access is blocked. On your iPhone open Settings › Safari › Camera and choose Allow, then try again.":"Couldn't start the camera ("+(e&&e.name||"error")+"). Use More › Scan from a photo.");return;}
  const v=$("vid");v.setAttribute("playsinline","");v.muted=true;v.srcObject=stream;try{await v.play();}catch(e){}
  const track=stream.getVideoTracks()[0];
  try{const caps=track.getCapabilities?track.getCapabilities():{};
    if(caps.focusMode&&caps.focusMode.includes("continuous"))track.applyConstraints({advanced:[{focusMode:"continuous"}]}).catch(()=>{});
    if(caps.torch){let on=false;$("torch").hidden=false;$("torch").onclick=()=>{on=!on;track.applyConstraints({advanced:[{torch:on}]}).catch(()=>{});};}}catch(e){}
  $("liveTip").textContent="Hold the barcode inside the frame, 10–20 cm away";
  const r=reader(),cv=$("cv"),ctx=cv.getContext("2d",{willReadFrequently:true});scanning=true;misses=0;
  const loop=()=>{if(!scanning)return;const w=v.videoWidth,h=v.videoHeight;
    if(w&&h){const full=misses%4===3;const sx=full?0:Math.round(w*.05),sw=full?w:Math.round(w*.9),sy=full?0:Math.round(h*.2),sh=full?h:Math.round(h*.6);
      const k=Math.min(1,1280/sw);cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);ctx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
      const res=tryDecode(r,cv);if(res){const code=res.getText();if(navigator.vibrate)try{navigator.vibrate(40)}catch(_){}stopLive();handleCode(code);return;}
      misses++;if(misses===40)$("liveTip").textContent="Still looking… add light, or move a little closer or further";}
    timer=setTimeout(loop,110);};
  loop();
};

$("exportBtn").onclick=async()=>{
  const cell=v=>{const s=String(v??"");return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const all=Object.values(items).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  let csv="﻿Name,Code,Category,Quantity,Unit,Reorder at,Status,Cost per unit,Stock value,Location,Expiry,Last updated\n"+all.map(i=>[i.name,i.code,i.category,num(i.qty),i.unit,num(i.reorder)||"",status(i).toUpperCase(),num(i.cost)||"",num(i.cost)?(num(i.qty)*num(i.cost)).toFixed(2):"",i.location,i.expiry,i.updatedAt?new Date(i.updatedAt).toLocaleString():""].map(cell).join(",")).join("\n");
  csv+="\n\nHistory\nWhen,Item,Code,Change,Type,Note\n"+moves.map(m=>[new Date(m.at).toLocaleString(),m.name,m.code,m.delta,m.type,m.note].map(cell).join(",")).join("\n");
  const fname="stock-"+new Date().toISOString().slice(0,10)+".csv",file=new File([csv],fname,{type:"text/csv"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Stock export"});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
};

render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
